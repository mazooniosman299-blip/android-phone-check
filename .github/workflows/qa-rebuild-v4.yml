name: Tilfazi v4 quality QA - not a release
on:
  push:
    branches: [tilfazi-v4-quality-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack QA-only source
        run: |
          tar -xJf rebuild_source.tar.xz
          grep -q "versionName '4.0.1-qa'" app/build.gradle
      - name: Android SDK 36
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
      - name: Install FFmpeg for real media decoding fixture tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Pure JVM, structure, and decoded-media tests
        run: RUN_MEDIA_TESTS=1 sh tests/run_all.sh
      - name: Android compile and lint
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: No publication
        run: echo 'QA only. No APK uploaded or published.'