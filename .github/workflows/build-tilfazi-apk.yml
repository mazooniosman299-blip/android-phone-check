name: Build Tilfazi LIVE APK
on:
  workflow_dispatch:
  push:
    branches: [tilfazi-live-app]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack Android source
        run: tar -xJf project.tar.xz
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tilfazi-LIVE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
