name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [tilfazi-live-app]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TILFAZI_SIGNING_STORE_B64: ${{ secrets.TILFAZI_SIGNING_STORE_B64 }}
      TILFAZI_STORE_PASSWORD: ${{ secrets.TILFAZI_STORE_PASSWORD }}
      TILFAZI_KEY_PASSWORD: ${{ secrets.TILFAZI_KEY_PASSWORD }}
      TILFAZI_KEY_ALIAS: ${{ secrets.TILFAZI_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android source
        run: tar -xJf project.tar.xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK packages
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          test -d "$ANDROID_HOME/build-tools/35.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Local source tests
        run: sh tests/run_all.sh
      - name: Prepare stable release signing (only when all secrets are configured)
        run: |
          if [ -n "$TILFAZI_SIGNING_STORE_B64" ] && [ -n "$TILFAZI_STORE_PASSWORD" ] && [ -n "$TILFAZI_KEY_PASSWORD" ] && [ -n "$TILFAZI_KEY_ALIAS" ]; then
            printf '%s' "$TILFAZI_SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/tilfazi-release.p12"
            chmod 600 "$RUNNER_TEMP/tilfazi-release.p12"
            echo "TILFAZI_KEYSTORE_PATH=$RUNNER_TEMP/tilfazi-release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build signed release if signing secrets exist; otherwise diagnostic debug
        run: |
          if [ -n "${TILFAZI_KEYSTORE_PATH:-}" ]; then
            gradle :app:assembleRelease :app:lintRelease --stacktrace
          else
            gradle :app:assembleDebug :app:lintDebug --stacktrace
          fi
      - name: Prepare unsigned non-debuggable release APK for secure offline signing
        run: |
          if [ -z "${TILFAZI_KEYSTORE_PATH:-}" ]; then
            gradle :app:assembleRelease :app:lintRelease --stacktrace
            test -s app/build/outputs/apk/release/app-release-unsigned.apk
          fi
      - name: Verify output
        run: |
          if [ -n "${TILFAZI_KEYSTORE_PATH:-}" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8

      - name: Prepare public APK download
        if: env.TILFAZI_KEYSTORE_PATH != ''
        run: |
          mkdir -p public-download
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk public-download/Tilfazi-LIVE-3.3.1.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk public-download/Tilfazi-LIVE-3.3.1.apk
          fi
          test -s public-download/Tilfazi-LIVE-3.3.1.apk
      - name: Publish APK as a downloadable GitHub release
        if: env.TILFAZI_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=tilfazi-v3.3.1
          ASSET=public-download/Tilfazi-LIVE-3.3.1.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "Tilfazi LIVE 3.3.1" --notes "Installable Android app, v3.3.1. Zee Alwan playback through the official STARZPLAY web player remains region/provider-dependent. Some channels require authorization. Debug-signed builds cannot upgrade over an APK signed by a different certificate."
          fi
      - name: Save unsigned release build for secure local signing
        if: env.TILFAZI_KEYSTORE_PATH == ''
        uses: actions/upload-artifact@v4
        with:
          name: Tilfazi-LIVE-release-unsigned-for-private-signing
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Save signed APK only when stable key secrets are configured
        if: env.TILFAZI_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: Tilfazi-LIVE-stable-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Save diagnostic debug APK (not eligible for normal upgrades)
        if: env.TILFAZI_KEYSTORE_PATH == ''
        uses: actions/upload-artifact@v4
        with:
          name: Tilfazi-LIVE-debug-diagnostic-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error