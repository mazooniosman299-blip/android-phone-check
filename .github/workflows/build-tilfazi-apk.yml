name: Build Tilfazi LIVE APK
on:
  workflow_dispatch:
  push:
    branches: [tilfazi-live-app]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack Android source
        run: tar -xJf project.tar.xz
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          test -d "$ANDROID_HOME/build-tools/35.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Check Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Verify signed APK and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 8
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tilfazi-LIVE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
