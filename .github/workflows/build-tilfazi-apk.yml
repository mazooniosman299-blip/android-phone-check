name: Validate Tilfazi Android release
on:
  workflow_dispatch:
  push:
    branches: [tilfazi-live-app]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TILFAZI_SIGNING_STORE_B64: ${{ secrets.TILFAZI_SIGNING_STORE_B64 }}
      TILFAZI_STORE_PASSWORD: ${{ secrets.TILFAZI_STORE_PASSWORD }}
      TILFAZI_KEY_PASSWORD: ${{ secrets.TILFAZI_KEY_PASSWORD }}
      TILFAZI_KEY_ALIAS: ${{ secrets.TILFAZI_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: tar -xJf project.tar.xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK packages
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          test -d "$ANDROID_HOME/build-tools/35.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Source tests
        run: sh tests/run_all.sh
      - name: Require complete stable signing configuration
        run: |
          set -euo pipefail
          count=0
          for value in "$TILFAZI_SIGNING_STORE_B64" "$TILFAZI_STORE_PASSWORD" "$TILFAZI_KEY_PASSWORD" "$TILFAZI_KEY_ALIAS"; do
            if [ -n "$value" ]; then count=$((count + 1)); fi
          done
          if [ "$count" != 0 ] && [ "$count" != 4 ]; then
            echo 'ERROR: configure all four signing secrets, or none for unsigned QA'
            exit 1
          fi
          if [ "$count" = 4 ]; then
            printf '%s' "$TILFAZI_SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/tilfazi-release.p12"
            chmod 600 "$RUNNER_TEMP/tilfazi-release.p12"
            echo "TILFAZI_KEYSTORE_PATH=$RUNNER_TEMP/tilfazi-release.p12" >> "$GITHUB_ENV"
          else
            echo 'No trusted signer configured: unsigned QA output only. No installable APK is published.'
          fi
      - name: Compile release and run Android lint
        run: gradle :app:assembleRelease :app:lintRelease --stacktrace
      - name: Verify package identity and signing certificate
        run: |
          set -euo pipefail
          TOOL="$ANDROID_HOME/build-tools/35.0.0"
          if [ -n "${TILFAZI_KEYSTORE_PATH:-}" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
            "$TOOL/apksigner" verify --verbose "$APK"
            BADGING=$("$TOOL/aapt" dump badging "$APK")
            printf '%s\n' "$BADGING" | grep -q "package: name='com.mazentv.live'"
            PIN=$(tr -d '\r\n ' < tools/release_signer_sha256.txt)
            ACTUAL=$("$TOOL/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')
            if [ "$ACTUAL" != "$PIN" ]; then echo 'REJECTED: signing certificate changed'; exit 1; fi
            echo 'PASS: approved signing key and package identity.'
          else
            test -s app/build/outputs/apk/release/app-release-unsigned.apk
            echo 'UNSIGNED QA ONLY: not installable and not an upgrade.'
          fi
      - name: Upload verified stable-signed APK only
        if: env.TILFAZI_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: tilfazi-verified-stable-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload unsigned QA artifact only
        if: env.TILFAZI_KEYSTORE_PATH == ''
        uses: actions/upload-artifact@v4
        with:
          name: tilfazi-unsigned-qa-not-installable
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
