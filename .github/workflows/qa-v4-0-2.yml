name: Tilfazi 4.0.2 Android QA (no release)
on:
  workflow_dispatch:
  push:
    branches: [tilfazi-v4-quality-qa]
    paths:
      - 'project_4_0_2_QA.tar.xz.b64'
      - '.github/workflows/qa-v4-0-2.yml'
jobs:
  qa:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract isolated 4.0.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-source
          base64 -d project_4_0_2_QA.tar.xz.b64 | tar -xJf - -C app-source
          test -f app-source/app/build.gradle
          grep -q "versionName '4.0.2-qa'" app-source/app/build.gradle
          echo "Source extracted; no release keys are present."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK platform 36
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
      - name: Run source regression suite
        working-directory: app-source
        run: sh tests/run_all.sh
      - name: Compile Android debug and run lint
        working-directory: app-source
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Check APK package and output
        run: |
          set -euo pipefail
          APK=app-source/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.mazentv.live'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          echo "QA-only debug APK compiled; not approved for upgrades or release."
      - name: Allow KVM acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 emulator smoke test (launch, UI, and crash detection)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb install -r app-source/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.mazentv.live/.MainActivity
            sleep 15
            PID="$(adb shell pidof com.mazentv.live | tr -d '\r')"
            test -n "$PID" || { echo 'FAIL: Tilfazi process exited after launch'; exit 1; }
            adb shell dumpsys activity activities | grep -q 'com.mazentv.live' || { echo 'FAIL: app was not launched'; exit 1; }
            adb shell uiautomator dump /sdcard/tilfazi-ui.xml >/dev/null
            adb shell cat /sdcard/tilfazi-ui.xml | grep -q 'com.mazentv.live' || { echo 'FAIL: main activity UI inaccessible'; exit 1; }
            adb logcat -d -v brief > android-log.txt
            if grep -A 10 'FATAL EXCEPTION' android-log.txt | grep -q 'com.mazentv.live'; then
              echo 'FAIL: app has a fatal exception'; exit 1
            fi
            echo 'PASS: Android 15 emulator installed and launched app, UI present, no observed crash.'
      - name: Retain emulator diagnostics only when QA fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tilfazi-402-emulator-failure-logs
          path: android-log.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: tilfazi-v4-0-2-unsigned-release-blocked-debug-QA
          path: app-source/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
